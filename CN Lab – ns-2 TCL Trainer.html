[{n:"1.tcl",c:R`# PROGRAM 1: TCP and UDP traffic with packet drop and packet receive analysis
set ns [new Simulator] ## Create the NS2 simulator
set tf [open tf.tr w] ## Create a trace file called tf.tr
$ns trace-all $tf ## Store all simulation events in tf.tr
set nf [open nf.nam w] ## Create a NAM animation file called nf.nam

$ns color 1 Blue ## Give flow 1 the color blue
$ns color 2 Red ## Give flow 2 the color red
set n0 [$ns node] ## Create node 0
set n1 [$ns node] ## Create node 1
set n2 [$ns node] ## Create node 2
set n3 [$ns node] ## Create node 3
$ns duplex-link $n0 $n2 2Mb 2ms DropTail ## Connect node 0 to node 2 with 2Mb bandwidth and 2ms delay
$ns duplex-link $n1 $n2 2Mb 2ms DropTail ## Connect node 1 to node 2 with 2Mb bandwidth and 2ms delay
$ns duplex-link $n2 $n3 0.4Mb 10ms DropTail ## Connect node 2 to node 3 with only 0.4Mb bandwidth and 10ms delay
$ns queue-limit $n2 $n3 5 ## Allow only 5 packets in the n2-n3 queue
# ---------------- UDP / CBR TRAFFIC ----------------
set udp1 [new Agent/UDP] ## Create a UDP agent for sending UDP packets
$udp1 set fid_ 1 ## Give this UDP traffic flow ID 1
$ns attach-agent $n1 $udp1 ## Attach the UDP sender to node 1
set null1 [new Agent/Null] ## Create a Null agent to receive UDP packets
$ns attach-agent $n3 $null1 ## Attach the UDP receiver to node 3
$ns connect $udp1 $null1 ## Connect UDP sender at n1 to receiver at n3
set cbr1 [new Application/Traffic/CBR] ## Create CBR traffic over UDP
$cbr1 set packetSize_ 512 ## Make every CBR packet 512 bytes
$cbr1 set interval_ 0.02 ## Send one packet every 0.02 seconds
$cbr1 attach-agent $udp1 ## Attach CBR traffic to the UDP agent
$ns at 0.5 "$cbr1 start" ## Start UDP/CBR traffic at 0.5 seconds
$ns at 4.5 "$cbr1 stop" ## Stop UDP/CBR traffic at 4.5 seconds
# ---------------- TCP / FTP TRAFFIC ----------------
set tcp1 [new Agent/TCP] ## Create a TCP agent for reliable data transfer
$tcp1 set fid_ 2 ## Give this TCP traffic flow ID 2
$ns attach-agent $n0 $tcp1 ## Attach the TCP sender to node 0
set tcpsink [new Agent/TCPSink] ## Create a TCP receiver/sink
$ns attach-agent $n3 $tcpsink ## Attach the TCP receiver to node 3
$ns connect $tcp1 $tcpsink ## Connect TCP sender at n0 to TCP receiver at n3
set ftp1 [new Application/FTP] ## Create an FTP application to generate TCP traffic
$ftp1 attach-agent $tcp1 ## Attach FTP application to the TCP agent
$ns at 1.0 "$ftp1 start" ## Start FTP traffic at 1 second
$ns at 4.5 "$ftp1 stop" ## Stop FTP traffic at 4.5 seconds
$ns at 5.0 "finish" ## End the simulation at 5 seconds
# ---------------- FINISH FUNCTION ----------------
proc finish {} { ## Create a function to finish the simulation
global ns tf nf ## Make simulator and files available inside this function
$ns flush-trace ## Write all remaining events into the trace file
close $tf ## Close the trace file
close $nf ## Close the NAM file

puts "Opening NAM..." ## Display a message before opening NAM
exec nam nf.nam & ## Open the network animation using NAM
exit 0 ## Exit the program successfully
}
$ns run ## Start the complete simulation`},

{

[{n:"2.tcl",c:R`# PROGRAM 2: FTP and Telnet traffic with TCP congestion window

# ---------------- RECORD TCP CONGESTION WINDOW ----------------
proc plotWindow {tcpSource file} { ## Create a function to record congestion window

$ns at 5.5 "plotWindow $tcp2 $cwind" ## Start recording Telnet's congestion window at 5.5 seconds
# ---------------- FINISH FUNCTION ----------------
proc finish {} { ## Create a function to finish the simulation
global ns tf nf cwind ## Make simulator and files available
$ns flush-trace ## Write remaining trace information
close $tf ## Close the trace file
close $nf ## Close the NAM file
close $cwind ## Close the congestion-window file

exec nam 2.nam & ## Open the network animation
exec xgraph win2.tr & ## Open the congestion-window graph

$ns at 10.0 "finish" ## Finish the simulation at 10 seconds
$ns run ## Start the simulation`}],
[{n:"3.tcl",c:R`# PROGRAM 3: Distance Vector Routing with Link Failure and TCP Congestion Window

$ns color 1 Blue ## Give flow 1 the color blue in NAM

set nf [open 3.nam w] ## Create/open 3.nam for network animation
$ns namtrace-all $nf ## Record information required by NAM
set cwind [open win3.tr w] ## Create/open win3.tr to store TCP congestion window values
$ns rtproto DV ## Use Distance Vector routing protocol
set n0 [$ns node] ## Create node 0
set n1 [$ns node] ## Create node 1
set n2 [$ns node] ## Create node 2
set n3 [$ns node] ## Create node 3
set n4 [$ns node] ## Create node 4
set n5 [$ns node] ## Create node 5
$ns duplex-link $n0 $n1 1Mb 10ms DropTail ## Connect node 0 and node 1 with 1Mb bandwidth and 10ms delay
$ns duplex-link $n1 $n4 1Mb 10ms DropTail ## Connect node 1 and node 4
$ns duplex-link $n4 $n5 1Mb 10ms DropTail ## Connect node 4 and node 5
$ns duplex-link $n5 $n3 1Mb 10ms DropTail ## Connect node 5 and node 3
$ns duplex-link $n3 $n2 1Mb 10ms DropTail ## Connect node 3 and node 2
$ns duplex-link $n2 $n0 1Mb 10ms DropTail ## Connect node 2 and node 0
$ns queue-limit $n1 $n4 10 ## Allow maximum 10 packets in the queue between node 1 and node 4
$ns queue-limit $n2 $n3 10 ## Allow maximum 10 packets in the queue between node 2 and node 3
$ns duplex-link-op $n0 $n1 orient right-up ## Draw the n0-n1 link upward/right in NAM
$ns duplex-link-op $n0 $n2 orient right-down ## Draw the n0-n2 link downward/right in NAM
$ns duplex-link-op $n1 $n4 orient right ## Draw the n1-n4 link horizontally in NAM
$ns duplex-link-op $n2 $n3 orient right ## Draw the n2-n3 link horizontally in NAM
$ns duplex-link-op $n4 $n5 orient right-down ## Draw the n4-n5 link downward/right in NAM
$ns duplex-link-op $n3 $n5 orient right-up ## Draw the n3-n5 link upward/right in NAM
set tcp0 [new Agent/TCP] ## Create a TCP agent to send data
$ns attach-agent $n0 $tcp0 ## Attach the TCP sender to node 0
set sink0 [new Agent/TCPSink] ## Create a TCP receiver/sink

proc plotWindow {tcpSource file} { ## Create a function to record TCP congestion window

[{n:"4.tcl",c:R`# PROGRAM 4: FTP file transfer using TCP

{n:"4transfer.awk",c:R`BEGIN {
sent_bytes = 0 ## Start total sent bytes at zero
recv_bytes = 0 ## Start total received bytes at zero
start_time = 0 ## Initially there is no start time
end_time = 0 ## Initially there is no end time
}
{
event = $1 ## Get event type from trace file
time = $2 ## Get event time
from = $3 ## Get source node
to = $4 ## Get destination node
type = $5 ## Get packet type
packet_size = $6 ## Get packet size
if (event == "+" && from == "0" && start_time == 0) { ## If first packet leaves server
start_time = time ## Save its time as starting time
}
if (event == "+" && from == "0" && type == "tcp") { ## If a TCP packet leaves server
sent_bytes += packet_size ## Add its size to total sent bytes
}
if (event == "r" && to == "1" && type == "tcp") { ## If TCP packet reaches client
recv_bytes += packet_size ## Add its size to received bytes
end_time = time ## Save its arrival time
}
}
END {
time_taken = end_time - start_time ## Calculate total transfer time
if (time_taken > 0) { ## Continue only if valid time exists
sent_throughput = (sent_bytes * 8) / (time_taken * 1000000) ## Convert sent bytes to Mbps
recv_throughput = (recv_bytes * 8) / (time_taken * 1000000) ## Convert received bytes to Mbps
printf "Transmission time required to transfer the file is %.6f seconds\n", time_taken ## Print transfer time
printf "Actual data sent from the server is %.6f Mbps\n", sent_throughput ## Print sending throughput
printf "Data Received by the client is %.6f Mbps\n", recv_throughput ## Print receiving throughput
}
else {
print "No valid TCP packets were received." ## Print error if no packets were received
}
}`},
{n:"4convert.awk",c:R`BEGIN {
bytes = 0 ## Initially received bytes = zero
}
{
event = $1 ## Get event type
time = $2 ## Get event time
from = $3 ## Get source
to = $4 ## Get destination
type = $5 ## Get packet type

function frame(t,id){id=id||"cv";

x.setLineDash([]);
T.F.forEach(f=>{if(t<f.s)return;const h=f.p.length-1,tr=h*.25;
for(let k=Math.floor((Math.min(t,f.e)-f.s)/f.iv);k>=0;k--){const ts=f.s+k*f.iv,ag=t-ts;if(ag>tr*2)break;
if(T.mv&&wd(T,ts)>=250)continue;
const dr=f.d&&(k*37%100)<f.d;let u=ag/tr*h,ack=false;

const q=pt(f,NP,u);x.fillStyle=ack?mut:f.c;x.fillRect(q[0]-3,q[1]-3,ack?4:7,ack?4:7)}});

let tm;
function diag(u,e){
if(u.toLowerCase()===e.toLowerCase())return"Case mismatch. Tcl is case-sensitive.";
if(u.replace(/\s+/g,"")===e.replace(/\s+/g,""))return"Spacing is wrong (a space is missing, extra, or in the wrong place).";
const d=s=>(s.match(/\$/g)||[]).length;if(d(u)<d(e))return"A $ is missing (use $ when reading a variable).";if(d(u)>d(e))return"Extra $ (don't use $ when setting a variable).";
for(const[a,b]of[["{","}"],["[","]"],["(",")"]]){const ca=(u.split(a).length-1)-(u.split(b).length-1);if(ca>0)return`Unclosed ${a}: missing ${b}.`;if(ca<0)return`Extra ${b}.`}
if((u.match(/"/g)||[]).length%2)return"Unclosed double quote.";
if(u.endsWith("\\")!==e.endsWith("\\"))return"Line-continuation backslash \\ mismatch (must be last character).";
const uw=u.split(/\s+/),ew=e.split(/\s+/);for(let i=0;i<Math.max(uw.length,ew.length);i++)if(uw[i]!==ew[i])return`Word ${i+1}: you wrote "${uw[i]||"(nothing)"}", expected "${ew[i]||"(nothing)"}".`;
return"Line differs from the expected line."}

document.getElementById("r").innerHTML=k>=E.length?`<div class="good">All lines done.</div>`:`<div class="warn">${k<U.length?`Line ${k+1} is not right yet. `:""}Next: <code>${sv(E[k])}</code></div>`}
